version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # Keep @types/node on the Node major used by the frontend Dockerfile and CI.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Local dev stack and the production stack (includes the pinned cloudflared image).
  - package-ecosystem: docker-compose
    directories:
      - /
      - /deploy
    schedule:
      interval: weekly
