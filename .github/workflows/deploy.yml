name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Never run two deploys at once; queue instead of cancelling a deploy mid-flight.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: notes-backend

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ECR tags are immutable, so a re-run of the same commit must not push again.
      - name: Check whether image already exists
        id: exists
        run: |
          # Only "image not found" means we need to build; any other error must fail.
          if out=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$GITHUB_SHA" 2>&1); then
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif grep -q ImageNotFoundException <<<"$out"; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "$out" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.exists.outputs.found != 'true'

      - name: Build and push backend image
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
        run: |
          set -euo pipefail

          cat > params.json <<JSON
          {
            "executionTimeout": ["900"],
            "commands": [
              "set -euo pipefail",
              "mkdir -p /opt/notes-app",
              "curl -fsSL '$RAW_BASE/deploy/deploy.sh' -o /opt/notes-app/deploy.sh",
              "curl -fsSL '$RAW_BASE/deploy/docker-compose.prod.yml' -o /opt/notes-app/docker-compose.prod.yml",
              "chmod 700 /opt/notes-app/deploy.sh",
              "/opt/notes-app/deploy.sh '$GITHUB_SHA' '$AWS_REGION'"
            ]
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $GITHUB_SHA" \
            --timeout-seconds 60 \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command: $COMMAND_ID"

          # Poll until the command reaches a terminal state (max ~20 min).
          STATUS=Pending
          for _ in $(seq 1 240); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
          done

          echo "::group::Deploy output"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "::endgroup::"
          echo "::group::Deploy stderr"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true
          echo "::endgroup::"

          echo "Final status: $STATUS"
          [ "$STATUS" = "Success" ]
