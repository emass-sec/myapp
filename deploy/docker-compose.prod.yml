# Production stack. Deployed to /opt/notes-app on the EC2 instance by deploy/deploy.sh,
# which writes the accompanying .env (secrets come from SSM, never from the repo).
name: notes-app

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD}
      POSTGRES_DB: notes
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${ECR_REGISTRY:?missing ECR_REGISTRY}/notes-backend:${IMAGE_TAG:?missing IMAGE_TAG}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?missing DATABASE_URL}
      CORS_ORIGINS: https://app.masnetsec.com
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?missing TUNNEL_TOKEN}

volumes:
  pgdata:
